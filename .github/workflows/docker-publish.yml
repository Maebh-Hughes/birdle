# Tests BIRDLE, then builds the Docker image and publishes it to the GitHub Container Registry as
# ghcr.io/<owner>/<repo> in lowercase (for github.com/Maebh-Hughes/birdle: ghcr.io/maebh-hughes/birdle).
#
#   push to main           -> :latest and :sha-<short commit>
#   push a tag like v1.2.3 -> :1.2.3, :1.2, :1 and :sha-<short commit>
#   Actions tab -> "Docker image" -> Run workflow -> the same for the branch or tag you pick
#   pull request to main   -> tests only, nothing is published
#
# The first push creates the package as PRIVATE. Give TrueNAS registry credentials (a read:packages
# token), or make the package public: see docs/TRUENAS.md. No repository secrets are needed here; the
# built-in GITHUB_TOKEN publishes the image.

name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Runs for the same branch or tag wait for each other (none is cancelled), so :latest always ends up
  # on the newest commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:words
      # vite build, then the check that no answer, hint or secret leaked into the client bundle
      - run: npm run build

  image:
    name: Build and push the image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Work out the image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # To also publish an arm64 image (Raspberry Pi, Apple silicon), add docker/setup-qemu-action@v4
      # before this step and set `platforms: linux/amd64,linux/arm64` below. Only the small
      # production-dependency install then runs under emulation (the client build runs natively), but
      # TrueNAS SCALE itself is x86-64 only, so amd64 is all it needs.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha
          labels: |
            org.opencontainers.image.title=BIRDLE
            org.opencontainers.image.description=A Wordle-style bird word game that runs as a Discord Activity
          annotations: |
            org.opencontainers.image.title=BIRDLE
            org.opencontainers.image.description=A Wordle-style bird word game that runs as a Discord Activity

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
